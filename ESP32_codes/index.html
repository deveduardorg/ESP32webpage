<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supervisório IoT - ESP32 & SQLite</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Biblioteca MQTT.js para conectar nos 3 brokers via WebSockets -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  </head>
  <body>
    <header class="cabecalho">
      <div>
        <h1>Estação de Telemetria ESP32</h1>
    </header>

    <main class="grid-metricas">
      <!-- MÉTRICAS DA TELA 1 DO ESP32 (CLIMA) -->
      <article class="card">
        <h2>Temperatura (DHT22)</h2>
        <p class="valor"><span id="val-temp">--.-</span> <small>°C</small></p>
      </article>

      <article class="card">
        <h2>Umidade Relativa (DHT22)</h2>
        <p class="valor"><span id="val-umid">--.-</span> <small>%UR</small></p>
      </article>

      <article class="card">
        <h2>Pressão Atmosférica (BMP280)</h2>
        <p class="valor">
          <span id="val-pres">----.-</span> <small>hPa</small>
        </p>
      </article>

      <!-- MÉTRICAS DA TELA 2 DO ESP32 (AMBIENTE) -->
      <article class="card">
        <h2>Luminosidade (LDR ADC1)</h2>
        <p class="valor"><span id="val-luz">--.-</span> <small>%Luz</small></p>
      </article>

      <article class="card">
        <h2>Índice de Gases (MQ-135)</h2>
        <p class="valor"><span id="val-gas">--.-</span> <small>%Ind</small></p>
      </article>

      <article class="card">
        <h2>Qualidade do Ar (FSM)</h2>
        <p class="valor" id="val-ar">---</p>
      </article>
    </main>

    <footer class="rodape">
      <span>ID Hardware: <strong id="val-device">---</strong></span>
      <span>Broker do ESP32: <strong id="val-broker-esp">---</strong></span>
      <span>Última Leitura: <strong id="val-horario">---</strong></span>
    </footer>

    <script src="scripts.js"></script>
  </body>
</html>
